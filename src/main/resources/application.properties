server.port=8080

# --- Base de datos (PostgreSQL) ---
# En Render, pega la "Internal Database URL" de tu Postgres en DB_URL (formato JDBC).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/metas}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Gmail (usa una CONTRASEÑA DE APLICACIÓN, no tu clave normal) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USER:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Reglas de la app ---
app.meta-diaria=50
app.email-destino=${GMAIL_USER:}
app.cors-origenes=http://localhost:5173,http://localhost:3000
# Formato cron de Spring: seg min hora dia mes diaSemana (zona America/Lima)
app.cron.recordatorio=0 0 18 * * *
app.cron.cierre=0 0 22 * * *
app.cron.cierre-mes=0 5 22 L * *

# --- Login (una sola contraseña + JWT) ---
app.admin-password=${ADMIN_PASSWORD}
app.jwt-secret=${JWT_SECRET}
app.jwt-dias=30